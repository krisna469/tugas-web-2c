<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas 8 Javascript</title>
</head>
<body>
    <h1> Tugas 8 Javascript</h1>
    <script type="text/javascript">
         
        //fungsi salam
        function salam() {
            document.write('<h2>Assalamualaikum</h2>');
        }
 
        //memanggil fungsi
        salam();

        //fungsi dengan parameter
        function tambah(a, b) {
            let hasil = a+b;
            return hasil
        }
 
        let result =tambah(8,10);
        document.write('<h2>hasil fungsi tambah '+
            result +'</h2>');
        document.write('<h2>hasil fungsi tambah '+
            tambah(9,6) +'</h2>');
 
 

 
    </script>

</body>
</html>
